<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Currency</title>
    <style>
        /* iOS System Design Tokens */
        :root {
            --ios-bg: #000000;
            --ios-card: #1c1c1e;
            --ios-input: #2c2c2e;
            --ios-blue: #0a84ff;
            --ios-text: #ffffff;
            --ios-secondary: #8e8e93;
        }

        body { 
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif; 
            display: flex; 
            justify-content: center; 
            align-items: flex-start;
            min-height: 100vh;
            margin: 0;
            padding-top: 60px;
            background-color: var(--ios-bg);
            color: var(--ios-text);
            -webkit-font-smoothing: antialiased;
        }

        .container { 
            width: 100%; 
            max-width: 350px; 
            padding: 20px;
            text-align: center;
        }

        h2 { 
            font-size: 34px; 
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 30px;
            text-align: left;
            padding-left: 10px;
        }

        /* iOS Grouped Table Cell Style */
        .input-group {
            background: var(--ios-card);
            border-radius: 14px;
            overflow: hidden;
            margin-bottom: 25px;
        }

        .row {
            display: flex;
            align-items: center;
            padding: 12px 16px;
            border-bottom: 0.5px solid #38383a;
        }

        .row:last-child {
            border-bottom: none;
        }

        .label {
            font-size: 17px;
            font-weight: 500;
            width: 60px;
            text-align: left;
        }

        input { 
            flex: 1;
            background: transparent;
            border: none;
            color: var(--ios-blue);
            font-size: 17px;
            text-align: right;
            outline: none;
            padding: 0;
            font-family: inherit;
        }

        input::placeholder {
            color: #48484a;
        }

        /* iOS-style Button */
        .clear-btn { 
            width: 100%;
            padding: 14px;
            background: var(--ios-card);
            color: #ff453a; /* iOS System Red */
            border: none;
            border-radius: 14px;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .clear-btn:active {
            background: #2c2c2e;
        }

        /* Subtle label for the rate */
        .rate-info {
            font-size: 13px;
            color: var(--ios-secondary);
            margin-top: 15px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Currency</h2>
    
    <div class="input-group">
        <div class="row">
            <span class="label">PHP</span>
            <input type="number" id="phpInput" placeholder="0" oninput="convert()">
        </div>
        <div class="row">
            <span class="label">CAD</span>
            <input type="number" id="cadInput" placeholder="0" oninput="convert()">
        </div>
    </div>
    
    <button onclick="resetApp()" class="clear-btn">Clear Values</button>
    
    <p id="rateDisplay" class="rate-info">Fetching latest rates...</p>
</div>

<script>
    let phpToCadRate = 0;

    async function getRates() {
        try {
            const response = await fetch('https://open.er-api.com/v6/latest/CAD');
            const data = await response.json();
            phpToCadRate = 1 / data.rates.PHP; 
            document.getElementById('rateDisplay').innerText = `1 PHP = ${phpToCadRate.toFixed(4)} CAD`;
        } catch (error) {
            document.getElementById('rateDisplay').innerText = "Rates unavailable offline";
        }
    }

    function convert() {
        const php = document.getElementById('phpInput');
        const cad = document.getElementById('cadInput');
        
        if (document.activeElement === php) {
            cad.value = php.value ? (php.value * phpToCadRate).toFixed(2) : "";
        } else {
            php.value = cad.value ? (cad.value / phpToCadRate).toFixed(2) : "";
        }
    }

    function resetApp() {
        document.getElementById('phpInput').value = "";
        document.getElementById('cadInput').value = "";
    }

    getRates();
</script>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel Converter</title>
    <style>
        body { font-family: -apple-system, sans-serif; display: flex; justify-content: center; padding: 20px; background: #f4f4f9; }
        .container { background: white; padding: 25px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 100%; max-width: 300px; text-align: center; }
        h2 { margin-bottom: 20px; color: #333; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 8px; font-size: 18px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; margin: 5px 0; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; color: white; background: #007bff; }
        .secondary-btn { background: #6c757d; }
    </style>
</head>
<body>

<div class="container">
    <h2 id="title">PHP ⇄ CAD</h2>
    <input type="number" id="localInput" placeholder="Enter Local Currency" oninput="convert()">
    <input type="number" id="cadInput" placeholder="Canadian Dollars ($)" oninput="convert()">
    
    <button onclick="toggleCurrency()" id="toggleBtn">Switch to Ringgit (MYR)</button>
    <button onclick="resetApp()" class="secondary-btn">Clear All</button>
</div>

<script>
    let currentRate = 0;
    let currentMode = "PHP"; // Default mode

    async function getRates() {
        try {
            const response = await fetch('https://open.er-api.com/v6/latest/CAD');
            const data = await response.json();
            
            if (currentMode === "PHP") {
                currentRate = 1 / data.rates.PHP;
                document.getElementById('title').innerText = "PHP ⇄ CAD";
                document.getElementById('localInput').placeholder = "Pesos (₱)";
                document.getElementById('toggleBtn').innerText = "Switch to Ringgit (MYR)";
            } else {
                currentRate = 1 / data.rates.MYR;
                document.getElementById('title').innerText = "MYR ⇄ CAD";
                document.getElementById('localInput').placeholder = "Ringgit (RM)";
                document.getElementById('toggleBtn').innerText = "Switch to Pesos (PHP)";
            }
        } catch (error) {
            console.error("Rate fetch failed");
        }
    }

    function convert() {
        const local = document.getElementById('localInput');
        const cad = document.getElementById('cadInput');
        
        if (document.activeElement === local) {
            cad.value = local.value ? (local.value * currentRate).toFixed(2) : "";
        } else {
            local.value = cad.value ? (cad.value / currentRate).toFixed(2) : "";
        }
    }

    function toggleCurrency() {
        currentMode = (currentMode === "PHP") ? "MYR" : "PHP";
        getRates();
        resetApp();
    }

    function resetApp() {
        document.getElementById('localInput').value = "";
        document.getElementById('cadInput').value = "";
    }

    getRates();
</script>

</body>
</html>

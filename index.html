<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PHP to CAD Converter - Dark Mode</title>
    <style>
        /* Dark Theme Styles */
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            display: flex; 
            justify-content: center; 
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: #121212; /* Deep dark background */
            color: #e0e0e0; 
        }

        .container { 
            background: #1e1e1e; /* Lighter dark grey for the card */
            padding: 25px; 
            border-radius: 20px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); 
            width: 100%; 
            max-width: 320px; 
            text-align: center; 
            border: 1px solid #333;
        }

        h2 { 
            margin-bottom: 25px; 
            color: #ffffff; 
            font-weight: 600;
        }

        input { 
            width: 100%; 
            padding: 14px; 
            margin: 10px 0; 
            border: 1px solid #333; 
            border-radius: 12px; 
            font-size: 18px; 
            box-sizing: border-box; 
            background: #2a2a2a; 
            color: #ffffff;
            outline: none;
            transition: border-color 0.3s ease;
        }

        input:focus {
            border-color: #007bff;
        }

        /* Styling for the numeric input arrows (optional) */
        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        button { 
            width: 100%; 
            padding: 14px; 
            margin-top: 15px; 
            border: none; 
            border-radius: 12px; 
            font-size: 16px; 
            font-weight: bold;
            cursor: pointer; 
            color: white; 
            background: #007bff; 
            transition: opacity 0.2s;
        }

        button:active {
            opacity: 0.8;
        }

        .clear-btn { 
            background: #333; 
            color: #bbb;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>PHP ⇄ CAD</h2>
    <input type="number" id="phpInput" placeholder="Enter Pesos (₱)" oninput="convert()">
    <input type="number" id="cadInput" placeholder="Canadian Dollars ($)" oninput="convert()">
    
    <button onclick="resetApp()" class="clear-btn">Clear All</button>
</div>

<script>
    let phpToCadRate = 0;

    async function getRates() {
        try {
            const response = await fetch('https://open.er-api.com/v6/latest/CAD');
            const data = await response.json();
            phpToCadRate = 1 / data.rates.PHP; 
        } catch (error) {
            console.error("Rate fetch failed");
        }
    }

    function convert() {
        const php = document.getElementById('phpInput');
        const cad = document.getElementById('cadInput');
        
        if (document.activeElement === php) {
            cad.value = php.value ? (php.value * phpToCadRate).toFixed(2) : "";
        } else {
            php.value = cad.value ? (cad.value / phpToCadRate).toFixed(2) : "";
        }
    }

    function resetApp() {
        document.getElementById('phpInput').value = "";
        document.getElementById('cadInput').value = "";
    }

    getRates();
</script>

</body>
</html>
